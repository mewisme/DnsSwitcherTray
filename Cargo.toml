[package]
name = "DnsSwitcherTray"
version = "0.0.1"
edition = "2024"
authors = ["Mew <hi@mewis.me>"]
license = "MIT"
repository = "https://github.com/mewisme/DnsSwitcherTray"
description = "Standalone native Windows DNS switcher tray, written entirely in Rust"
build = "build.rs"

[dependencies]
serde_json = "1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_SystemInformation",
  "Win32_Security_Authentication_Identity",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
